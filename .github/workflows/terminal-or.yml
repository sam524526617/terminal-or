# Robot du Terminal or : génère le tableau de bord et le publie sur GitHub Pages.
# Emplacement dans le dépôt : .github/workflows/terminal-or.yml
name: Terminal or

on:
  schedule:
    - cron: "*/15 * * * 1-5"   # toutes les 15 min du lundi au vendredi (heures UTC)
    - cron: "7 */3 * * 0,6"    # toutes les 3 h le week-end
    - cron: "17 6 1 * *"       # le 1er du mois : maintien en vie du dépôt
  workflow_dispatch:           # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: terminal-or
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GitHub désactive les tâches planifiées d'un dépôt public sans activité depuis 60 jours.
      # Ce petit commit mensuel l'en empêche.
      - name: Maintien en vie (1er du mois)
        if: github.event.schedule == '17 6 1 * *'
        run: |
          date -u > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "Maintien en vie du terminal" || true
          git push || true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les modules
        run: pip install -r requirements.txt

      - name: Récupérer le cache des sources
        uses: actions/cache@v6
        with:
          path: .cache_terminal_or
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Générer le tableau de bord
        run: python terminal_or.py --site site
        env:
          # Analyste IA (optionnel) : sans ce secret, la page fonctionne normalement.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
