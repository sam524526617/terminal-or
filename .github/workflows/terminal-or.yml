# Robot du Terminal or : génère le tableau de bord et le publie sur GitHub Pages.
# Lancé toutes les 15 minutes par cron-job.org, ou à la main avec « Run workflow ».
name: Terminal or

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: terminal-or
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les modules
        run: pip install -r requirements.txt

      - name: Récupérer le cache des sources
        uses: actions/cache@v6
        with:
          path: .cache_terminal_or
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Générer le tableau de bord
        run: python terminal_or.py --site site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
